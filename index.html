<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>Turni PWA v8</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
body{margin:0}.app{max-width:900px;margin:auto;padding:18px 14px 70px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:25px;margin:0}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0000000d}
input,select,button{font:inherit}.file{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff;box-sizing:border-box}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:14px;font-weight:650}
select,input[type=date]{display:block;margin-top:5px;padding:10px;border:1px solid #d1d5db;border-radius:10px;width:100%;box-sizing:border-box;background:#fff}
button{border:0;border-radius:11px;padding:10px 13px;background:#111827;color:#fff;cursor:pointer}
.secondary{background:#e5e7eb;color:#111827}.small{font-size:13px;color:#6b7280}
.shift{padding:14px;border-radius:14px;background:#fff;margin:9px 0;box-shadow:0 2px 8px #0000000a}
.date{font-weight:750;text-transform:capitalize}.time{font-size:23px;font-weight:850;margin-top:2px}.loc{font-size:17px;margin-top:4px}
.today{border:2px solid #111827}.status{padding:10px;border-radius:10px;background:#f9fafb;font-size:14px}
.empty{padding:25px;text-align:center;color:#6b7280}
@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>📅 I miei turni</h1><div style="font-size:12px;color:#6b7280;margin-top:3px">Versione app: <b>v8.0.0</b></div></div><button id="install" class="secondary" hidden>Installa</button></header>

<div class="card">
  <b>Aggiorna turni</b>
  <input id="file" class="file" type="file" accept=".xlsx,.xlsm">
  <p class="small">Il file viene elaborato direttamente nel browser. Dopo il primo caricamento i turni restano salvati su questo dispositivo.</p>
  <div id="status"></div>
</div>

<div id="controls" class="card" hidden>
  <div class="grid">
    <label>Persona<select id="person"></select></label>
    <label>Location<select id="location"><option>Tutte</option></select></label>
    <label>Da<input id="from" type="date"></label>
    <label>A<input id="to" type="date"></label>
  </div>
  <div style="margin-top:12px"><button id="today">📍 Vai a oggi</button></div>
</div>
<div id="results"></div>
</div>

<script>
const DB="turni-db-v5", STORE="shifts", YEAR=2026;
let allRows=[];

function idb(){
 return new Promise((resolve,reject)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id"})};
  r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
 });
}
async function saveRows(rows){
 const db=await idb(), tx=db.transaction(STORE,"readwrite"), st=tx.objectStore(STORE);
 st.clear(); rows.forEach(x=>st.put(x));
 return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
}
async function loadRows(){
 const db=await idb(), tx=db.transaction(STORE,"readonly"), req=tx.objectStore(STORE).getAll();
 return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});
}

function rgb(fill){
 if(!fill || fill.type!=="pattern") return "none";
 const c=fill.fgColor||{};
 if(c.type==="rgb" && c.argb) return c.argb.toUpperCase();
 if(c.type==="theme" && c.theme!=null) return "theme:"+c.theme+":"+Number(c.tint||0).toFixed(6);
 if(c.type==="indexed" && c.indexed!=null) return "indexed:"+c.indexed;
 return "none";
}
function isYellow(cell){
 return rgb(cell.fill)==="FFFFFF00";
}
function isDefaultX(cell){
 const x=rgb(cell.fill);
 return x==="none" || x==="00000000" || x.startsWith("theme:0:");
}
function isX(v){return String(v??"").trim().toLowerCase()==="x"}

function parseDate(v){
 if(v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(),v.getMonth(),v.getDate());
 if(typeof v==="number"){
   const d=new Date(Math.round((v-25569)*86400*1000));
   return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
 }
 const s=String(v??"").trim().toLowerCase();
 const months={gennaio:0,febbraio:1,marzo:2,aprile:3,maggio:4,giugno:5,luglio:6,agosto:7,settembre:8,ottobre:9,novembre:10,dicembre:11};
 const m=s.match(/(\d{1,2})\s+([a-zàèéìòù]+)/);
 if(m && months[m[2]]!==undefined)return new Date(YEAR,months[m[2]],+m[1]);
 return null;
}
function normalizeDate(v){
 if(v instanceof Date && !Number.isNaN(v.getTime())) return v;
 if(v && typeof v === "object"){
   if(v.result!==undefined) return normalizeDate(v.result);
   if(v.text!==undefined) return normalizeDate(v.text);
   if(v.richText) return normalizeDate(v.richText.map(x=>x.text||"").join(""));
 }
 const d=new Date(v);
 if(!Number.isNaN(d.getTime())) return d;
 const p=parseDate(v);
 if(p) return p;
 return new Date(NaN);
}
function keyDate(v){const d=normalizeDate(v); if(Number.isNaN(d.getTime())) return ""; return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function dayOf(v){const d=normalizeDate(v); return Number.isNaN(d.getTime()) ? -1 : d.getDay()}
function fmtDate(d){return new Intl.DateTimeFormat("it-IT",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}).format(normalizeDate(d))}

function getDayBlocks(ws){
 const starts=[];
 for(let c=2;c<=ws.columnCount;c++){
   const v=ws.getCell(1,c).value;
   if(v!==null && v!==undefined && String(v).trim()!==""){
     const d=parseDate(v);
     if(d)starts.push({col:c,date:d});
   }
 }
 return starts.map((s,i)=>({start:s.col,end:(starts[i+1]?.col||ws.columnCount+1)-1,date:s.date}));
}
function locationRows(ws){
 const a=[];
 for(let r=1;r<=ws.rowCount;r++){
   const cell=ws.getCell(r,1), v=cell.value;
   if(typeof v!=="string" || !v.trim() || isYellow(cell))continue;
   const name=v.trim();
   if(name===name.toUpperCase())a.push({row:r,name,color:rgb(cell.fill)});
 }
 return a;
}
function nearestPrevious(locs,row){
 let x=null; for(const l of locs)if(l.row<row)x=l; return x;
}
function buildGlobalColorMap(wb){
 const map={};
 for(const ws of wb.worksheets)for(const l of locationRows(ws)){
   map[l.color]??={}; map[l.color][l.name]=(map[l.color][l.name]||0)+1;
 }
 const out={};
 for(const [color,names] of Object.entries(map))
   out[color]=Object.entries(names).sort((a,b)=>b[1]-a[1])[0][0];
 return out;
}
function parseWorkbook(wb){
 const global=buildGlobalColorMap(wb), rows=[];
 for(const ws of wb.worksheets){
   const locs=locationRows(ws), blocks=getDayBlocks(ws);
   for(let r=1;r<=ws.rowCount;r++){
     const personCell=ws.getCell(r,1), person=personCell.value;
     if(typeof person!=="string" || !person.trim())continue;
     // Employee rows are text names in column A. We do not rely on the yellow fill here:
     // ExcelJS can expose theme/indexed fills differently depending on the workbook.
     // Location rows are handled separately below.
     for(const b of blocks){
       const xs=[];
       for(let c=b.start;c<=b.end;c++)if(isX(ws.getCell(r,c).value))xs.push(c);
       if(!xs.length)continue;
       const groups=[[xs[0]]];
       for(let i=1;i<xs.length;i++){
         if(xs[i]===xs[i-1]+1)groups.at(-1).push(xs[i]); else groups.push([xs[i]]);
       }
       for(const group of groups){
         let segment=[group[0]];
         const getLoc=c=>{
           const x=ws.getCell(r,c), col=rgb(x.fill);
           if(isDefaultX(x)) return nearestPrevious(locs,r)?.name || null;
           return locs.find(z=>z.color===col)?.name || global[col] || null;
         };
         let loc=getLoc(group[0]);
         for(let i=1;i<group.length;i++){
           const next=getLoc(group[i]);
           if(next===loc)segment.push(group[i]);
           else{
             addSegment(rows,ws,r,person,b,segment,loc);
             segment=[group[i]];loc=next;
           }
         }
         addSegment(rows,ws,r,person,b,segment,loc);
       }
     }
   }
 }
 // For Sundays, the dedicated "domeniche" sheet is authoritative.
 const sundayDates=new Set(rows.filter(x=>x.sheet.toLowerCase()==="domeniche"&&dayOf(x.date)===0).map(x=>keyDate(normalizeDate(x.date))));
 let result=rows.filter(x=>!(dayOf(x.date)===0&&sundayDates.has(keyDate(normalizeDate(x.date)))&&x.sheet.toLowerCase()!=="domeniche"));
 const seen=new Set();
 result=result.filter(x=>{const k=[x.person,keyDate(x.date),x.start,x.end,x.location].join("|");if(seen.has(k))return false;seen.add(k);return true});
 result.sort((a,b)=>normalizeDate(a.date)-normalizeDate(b.date)||a.start-b.start||a.location.localeCompare(b.location));
 return result;
}
function addSegment(rows,ws,r,person,b,segment,loc){
 const start=Number(ws.getCell(2,segment[0]).value), end=Number(ws.getCell(3,segment.at(-1)).value);
 if(!Number.isFinite(start)||!Number.isFinite(end))return;
 rows.push({id:crypto.randomUUID(),person:person.trim(),date:b.date.toISOString(),start,end,location:loc||"DA VERIFICARE",sheet:ws.name});
}

function diagnoseWorkbook(wb){
 let sheets=0, dates=0, people=0, xs=0, yellow=0;
 for(const ws of wb.worksheets){
   sheets++;
   for(let c=2;c<=ws.columnCount;c++) if(parseDate(ws.getCell(1,c).value)) dates++;
   for(let r=1;r<=ws.rowCount;r++){
     const v=ws.getCell(r,1).value;
     if(typeof v==="string" && v.trim()){ people++; if(isYellow(ws.getCell(r,1))) yellow++; }
     for(let c=2;c<=ws.columnCount;c++) if(isX(ws.getCell(r,c).value)) xs++;
   }
 }
 return `Fogli: ${sheets}, date riconosciute: ${dates}, nomi in colonna A: ${people}, celle x: ${xs}, celle gialle: ${yellow}.`;
}
function hydrate(rows){return rows.map(x=>({...x,date:new Date(x.date)}))}
function setup(){
 const people=[...new Set(allRows.map(x=>x.person))].sort((a,b)=>a.localeCompare(b));
 const p=document.getElementById("person");p.innerHTML=people.map(x=>`<option>${esc(x)}</option>`).join("");
 if(people.includes("Pertosa"))p.value="Pertosa";
 const locs=[...new Set(allRows.map(x=>x.location))].sort((a,b)=>a.localeCompare(b));
 document.getElementById("location").innerHTML="<option>Tutte</option>"+locs.map(x=>`<option>${esc(x)}</option>`).join("");
 const dates=allRows.map(x=>keyDate(x.date)); if(dates.length){document.getElementById("from").value=dates[0];document.getElementById("to").value=dates.at(-1)}
 document.getElementById("controls").hidden=false;render();
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 const person=document.getElementById("person").value, loc=document.getElementById("location").value;
 const from=document.getElementById("from").value,to=document.getElementById("to").value;
 let rows=allRows.filter(x=>x.person===person);
 if(loc!=="Tutte")rows=rows.filter(x=>x.location===loc);
 if(from)rows=rows.filter(x=>keyDate(x.date)>=from); if(to)rows=rows.filter(x=>keyDate(x.date)<=to);
 const today=keyDate(new Date());
 document.getElementById("results").innerHTML=rows.length?rows.map(x=>`<div class="shift ${keyDate(x.date)===today?"today":""}">
   <div class="date">${esc(fmtDate(x.date))}</div>
   <div class="time">${String(x.start).padStart(2,"0")}:00–${String(x.end).padStart(2,"0")}:00</div>
   <div class="loc">📍 ${esc(x.location)}</div>
 </div>`).join(""):`<div class="card empty">Nessun turno trovato per i filtri selezionati.</div>`;
}
document.getElementById("file").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 const status=document.getElementById("status");
 status.innerHTML="<div class='status'>⏳ Sto leggendo l'Excel e i colori delle celle...</div>";
 try{
   const wb=new ExcelJS.Workbook();
   await wb.xlsx.load(await f.arrayBuffer());
   const rows=hydrate(parseWorkbook(wb));
   if(!rows.length){
     const info=diagnoseWorkbook(wb);
     throw new Error("Non ho trovato turni. " + info);
   }
   allRows=rows; await saveRows(rows);
   status.innerHTML=`<div class='status'>✅ Salvati ${rows.length} turni. File aggiornato: ${esc(f.name)}</div>`;
   setup();
 }catch(err){
   console.error(err);
   status.innerHTML=`<div class='status'>❌ Errore: ${esc(err.message||String(err))}</div>`;
 }
};
["person","location","from","to"].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById("today").onclick=()=>{
 const t=keyDate(new Date());
 document.getElementById("from").value=t;document.getElementById("to").value=t;render();
};

(async()=>{
 try{
   allRows=hydrate(await loadRows());
   if(allRows.length){
     document.getElementById("status").innerHTML=`<div class='status'>💾 Trovati ${allRows.length} turni già salvati su questo dispositivo.</div>`;
     setup();
   }else document.getElementById("status").innerHTML="<div class='status'>Nessun file ancora caricato.</div>";
 }catch(e){console.error(e)}
})();
let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("install").hidden=false});
document.getElementById("install").onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
